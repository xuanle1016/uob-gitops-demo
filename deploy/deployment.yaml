apiVersion: apps/v1
kind: Deployment
metadata:
  name: uob-app-deployment
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: uob-demo-app
  template:
    metadata:
      labels:
        app: uob-demo-app
    spec:
      containers:
      - name: uob-app
        image: ghcr.io/xuanle1016/uob-gitops-demo:latest
        ports:
        - containerPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: uob-app-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: uob-demo-app
  ports:
  - port: 80
    targetPort: 5000
    nodePort: 30080