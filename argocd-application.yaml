apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: uob-gitops-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/xuanle1016/uob-gitops-demo.git'
    targetRevision: HEAD
    path: deploy
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: default
  syncPolicy:
    automated:
      selfHeal: true
      prune: true